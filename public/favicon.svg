<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="atomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <!-- Pressure gauge outline / Molecule orbital -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#atomGrad)" stroke-width="2.5" opacity="0.4" stroke-dasharray="4 2" />
  <!-- Central core -->
  <circle cx="32" cy="32" r="6" fill="#38bdf8" />
  <!-- Orbiting Gas Molecules -->
  <circle cx="20" cy="22" r="4" fill="#60a5fa" />
  <circle cx="44" cy="24" r="3.5" fill="#f43f5e" />
  <circle cx="26" cy="45" r="3.5" fill="#34d399" />
  <circle cx="43" cy="42" r="4.5" fill="#fbbf24" />
  <!-- Dynamic vector trail -->
  <path d="M20 22 L24 25" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" />
  <path d="M44 24 L40 28" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round" />
  <path d="M26 45 L29 41" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" />
  <path d="M43 42 L47 38" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />
</svg>
